name: One-shot camera framing extraction

"on":
  push:
    branches:
      - refactor/extract-camera-framing

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/extract-camera-framing

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract camera framing UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()

          anchor = "import { ActiveSceneBasicsSection } from './components/ActiveSceneBasicsSection';\n"
          replacement_import = anchor + "import { CameraFramingSection } from './components/CameraFramingSection';\n"
          assert anchor in text, 'active scene import anchor missing'
          text = text.replace(anchor, replacement_import, 1)

          start_marker = '                <section className="bg-[var(--bg-card)] p-4 rounded-2xl border border-[var(--border)]">\n                   <h3 className="font-medium mb-3 text-sm text-[var(--text-muted)]">إعدادات الكاميرا والكادر</h3>'
          end_marker = '                <section>\n                   <h3 className="font-medium mb-3">الملابس والشخصية</h3>'
          start = text.index(start_marker)
          end = text.index(end_marker, start)

          replacement = '''                <CameraFramingSection
                  state={state}
                  onCaptureTypeChange={captureType => setState(current => ({
                    ...current,
                    captureType,
                    groupSelfieEnabled: captureType === 'front-selfie' ? current.groupSelfieEnabled : false
                  }))}
                  onFramingChange={framing => setState(current => ({ ...current, framing }))}
                  onCameraAngleChange={cameraAngle => setState(current => ({ ...current, cameraAngle }))}
                  onGroupSelfieEnabledChange={groupSelfieEnabled => setState(current => ({ ...current, groupSelfieEnabled }))}
                  onGroupSelfieCompanionCountChange={groupSelfieCompanionCount => setState(current => ({ ...current, groupSelfieCompanionCount }))}
                  onFramingImperfectionChange={framingImperfection => setState(current => ({ ...current, framingImperfection }))}
                  onDigitalZoomChange={useDigitalZoom => setState(current => ({ ...current, useDigitalZoom }))}
                />\n\n'''

          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary workflow
        run: rm .github/workflows/extract-camera-framing-once.yml

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx .github/workflows/extract-camera-framing-once.yml
          git commit -m 'refactor: extract camera framing section'
          git push
