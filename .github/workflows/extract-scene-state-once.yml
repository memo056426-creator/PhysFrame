name: One-shot scene state extraction

on:
  push:
    branches:
      - refactor/extract-scene-state

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/extract-scene-state

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Update App state imports
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()

          start_marker = '// --- MAIN REACT APPLICATION ---\n'
          end_marker = 'export default function PhysFrameApp() {'
          state_import = "import { DEFAULT_STATE, normalizeSceneState } from './state/sceneState';\n"

          assert start_marker in text, 'main app marker missing'
          assert end_marker in text, 'PhysFrameApp marker missing'
          assert state_import not in text, 'state import already present'

          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker)
          block = text[start:end]
          assert 'const DEFAULT_STATE: SceneState' in block
          assert 'const normalizeSceneState' in block

          text = text[:start] + '\n' + text[end:]
          text = text.replace(
              "import { buildSemanticScene } from './engine/semanticScene';\n",
              "import { buildSemanticScene } from './engine/semanticScene';\n" + state_import,
              1
          )
          text = text.replace("import { resolveSceneConflicts } from './engine/rules';\n", '', 1)
          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Engine tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary workflow
        run: rm .github/workflows/extract-scene-state-once.yml

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx .github/workflows/extract-scene-state-once.yml
          git commit -m 'refactor: extract scene state normalization'
          git push
