name: One-shot lighting section extraction

"on":
  push:
    branches:
      - refactor/extract-lighting-section
    paths:
      - .github/workflows/extract-lighting-section-once.yml

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/extract-lighting-section

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract lighting UI
        run: python3 tools/extract_lighting_section.py

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary helpers
        run: rm tools/extract_lighting_section.py .github/workflows/extract-lighting-section-once.yml

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/components/LightingSection.tsx tools/extract_lighting_section.py .github/workflows/extract-lighting-section-once.yml
          git commit -m 'refactor: extract lighting section'
          git push
