name: One-shot active scene formatting cleanup

"on":
  push:
    branches:
      - refactor/extract-active-scene-basics

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/extract-active-scene-basics

      - name: Fix App component indentation
        shell: bash
        run: |
          sed -i 's/^        state=/                  state=/' src/App.tsx
          sed -i 's/^        onVibePreset=/                  onVibePreset=/' src/App.tsx
          sed -i 's/^        onChangeLocation=/                  onChangeLocation=/' src/App.tsx
          sed -i 's/^        onSubSceneChange=/                  onSubSceneChange=/' src/App.tsx
          sed -i 's/^        onActivityChange=/                  onActivityChange=/' src/App.tsx
          sed -i 's/^        onPoseChange=/                  onPoseChange=/' src/App.tsx
          sed -i 's/^      \/>/                \/>/' src/App.tsx

      - name: Remove temporary workflow
        run: rm .github/workflows/fix-active-scene-basics-format-once.yml

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx .github/workflows/fix-active-scene-basics-format-once.yml
          git commit -m 'style: align active scene component call'
          git push
