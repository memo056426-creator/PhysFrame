name: Verify selfie pose controls once

on:
  push:
    branches:
      - feature/selfie-pose-controls
    paths:
      - .github/workflows/verify-selfie-pose-controls-once.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/selfie-pose-controls

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary workflow
        run: rm .github/workflows/verify-selfie-pose-controls-once.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove selfie pose verifier"
          git push origin HEAD:feature/selfie-pose-controls
