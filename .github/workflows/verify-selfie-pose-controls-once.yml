name: Verify selfie pose controls once

on:
  push:
    branches:
      - feature/selfie-pose-controls
    paths:
      - .github/workflows/verify-selfie-pose-controls-once.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/selfie-pose-controls

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update remaining typed test fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/engine/promptText.test.ts')
          text = path.read_text()
          needle = "  pose: 'standing-steady',\n"
          replacement = needle + "  selfiePoseModifier: 'front-natural',\n  freeHandPose: 'relaxed',\n"
          if "selfiePoseModifier: 'front-natural'" not in text:
              text = text.replace(needle, replacement, 1)
              path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary workflow
        run: rm .github/workflows/verify-selfie-pose-controls-once.yml

      - name: Commit verified changes and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: complete selfie pose coverage"
          git push origin HEAD:feature/selfie-pose-controls
