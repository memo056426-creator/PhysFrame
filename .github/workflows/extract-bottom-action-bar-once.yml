name: One-shot bottom action bar extraction

on:
  push:
    branches:
      - refactor/extract-bottom-action-bar

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/extract-bottom-action-bar
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract bottom action bar UI
        run: python3 scripts/extract_bottom_action_bar.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format touched files
        run: ./node_modules/.bin/prettier src/App.tsx src/components/BottomActionBar.tsx --write

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary helpers
        run: rm scripts/extract_bottom_action_bar.py .github/workflows/extract-bottom-action-bar-once.yml

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/BottomActionBar.tsx scripts/extract_bottom_action_bar.py .github/workflows/extract-bottom-action-bar-once.yml
          git commit -m "refactor: extract bottom action bar"
          git push origin HEAD:refactor/extract-bottom-action-bar
