name: Verify presets hook once

on:
  push:
    branches:
      - refactor/extract-presets-hook

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Remove temporary workflow
        run: rm .github/workflows/verify-presets-hook-once.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/verify-presets-hook-once.yml
          git commit -m "chore: remove presets verification workflow"
          git push
