name: One-shot reference image section extraction

on:
  push:
    branches:
      - refactor/extract-reference-image-section

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/extract-reference-image-section

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract reference image UI from App
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()

          text = text.replace("import React, { useState, useEffect, useRef } from 'react';", "import React, { useState, useEffect } from 'react';", 1)
          text = text.replace("import { REFERENCE_IMAGE_ACCEPT, sanitizeReferenceImage } from './engine/referenceImage';", "import { sanitizeReferenceImage } from './engine/referenceImage';", 1)
          anchor = "import type { VibePreset } from './data/sceneOptions';\n"
          insert = anchor + "import { ReferenceImageSection } from './components/ReferenceImageSection';\n"
          assert anchor in text, 'component import anchor missing'
          text = text.replace(anchor, insert, 1)
          text = text.replace("  const fileInputRef = useRef<HTMLInputElement>(null);\n", "", 1)
          text = text.replace("    if (fileInputRef.current) fileInputRef.current.value = '';\n", "", 1)

          start_marker = '        <div className="px-5 py-4">\n          <h2 className="text-sm font-semibold mb-3 text-[var(--text-muted)]">الصورة المرجعية</h2>'
          end_marker = '\n\n        <div className="px-5 py-2">'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''        <ReferenceImageSection
          hasReference={hasReference}
          imageUrl={imageUrl}
          hasGlasses={state.hasGlasses}
          onImageUpload={handleImageUpload}
          onImageDelete={handleImageDelete}
          onGlassesChange={hasGlasses => setState(current => ({ ...current, hasGlasses }))}
        />'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary workflow
        run: rm .github/workflows/extract-reference-image-section-once.yml

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx .github/workflows/extract-reference-image-section-once.yml
          git commit -m 'refactor: extract reference image section'
          git push
