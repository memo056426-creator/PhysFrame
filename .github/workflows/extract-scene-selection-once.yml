name: One-shot scene selection extraction

"on":
  push:
    branches:
      - refactor/extract-scene-selection

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/extract-scene-selection

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract scene selection UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()

          anchor = "import { ReferenceImageSection } from './components/ReferenceImageSection';\n"
          scene_import = "import { SceneSelectionSection } from './components/SceneSelectionSection';\n"
          assert anchor in text, 'reference component import anchor missing'
          if scene_import not in text:
              text = text.replace(anchor, anchor + scene_import, 1)

          marker = '<div className="py-10 text-center animate-fade-in">'
          start = text.index(marker)
          line_start = text.rfind('\n', 0, start) + 1
          indent = text[line_start:start]
          end = text.index('\n          ) : (', start)
          text = text[:line_start] + indent + '<SceneSelectionSection onSelect={handleSceneSelect} />' + text[end:]
          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary workflow
        run: rm .github/workflows/extract-scene-selection-once.yml

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx .github/workflows/extract-scene-selection-once.yml
          git commit -m 'refactor: extract scene selection section'
          git push
