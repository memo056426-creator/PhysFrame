name: One-shot appearance section extraction

"on":
  push:
    branches:
      - refactor/extract-appearance-section
    paths:
      - .github/workflows/extract-appearance-section-once.yml

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/extract-appearance-section

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract appearance UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()

          outfits_import = "import { OUTFITS } from './data/outfits';\n"
          assert outfits_import in text, 'OUTFITS import not found'
          text = text.replace(outfits_import, '', 1)

          old_options_import = "import { EXPRESSIONS, FACIAL_HAIR_STATES, FLASH_MODES, GAZE_DIRECTIONS, HAND_PROPS, HAIRSTYLES, SCENE_FAMILIES } from './data/sceneOptions';"
          new_options_import = "import { FACIAL_HAIR_STATES, FLASH_MODES, GAZE_DIRECTIONS, HAND_PROPS, SCENE_FAMILIES } from './data/sceneOptions';"
          assert old_options_import in text, 'sceneOptions import not found'
          text = text.replace(old_options_import, new_options_import, 1)

          camera_import = "import { CameraFramingSection } from './components/CameraFramingSection';\n"
          appearance_import = "import { AppearanceSection } from './components/AppearanceSection';\n"
          assert camera_import in text, 'CameraFramingSection import not found'
          assert appearance_import not in text, 'AppearanceSection import already present'
          text = text.replace(camera_import, camera_import + appearance_import, 1)

          heading = '>الملابس والشخصية</h3>'
          heading_index = text.index(heading)
          start = text.rfind('                <section>', 0, heading_index)
          assert start != -1, 'appearance section start not found'
          end_marker = '\n\n                <section className="bg-gradient-to-b from-[#1E1A16]'
          end = text.index(end_marker, heading_index)

          replacement = '\n'.join([
              '                <AppearanceSection',
              '                  state={state}',
              '                  onOutfitChange={outfitId => setState(current => ({ ...current, outfitId }))}',
              '                  onHairStyleChange={hairStyle => setState(current => ({ ...current, hairStyle }))}',
              '                  onExpressionChange={expression => setState(current => ({ ...current, expression }))}',
              '                />'
          ])
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary workflow
        run: rm .github/workflows/extract-appearance-section-once.yml

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/components/AppearanceSection.tsx .github/workflows/extract-appearance-section-once.yml
          git commit -m 'refactor: extract appearance section'
          git push
