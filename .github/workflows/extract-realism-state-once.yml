name: One-shot realism state extraction

on:
  push:
    branches:
      - refactor/extract-realism-state

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/extract-realism-state

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply refactor
        run: python3 scripts/extract_realism_state.py

      - name: Install dependencies
        run: npm ci

      - name: Engine tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary refactor files
        run: rm scripts/extract_realism_state.py .github/workflows/extract-realism-state-once.yml

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/engine/realismState.ts src/engine/realismState.test.ts scripts .github/workflows
          git commit -m "refactor: extract realism state engine"
          git push origin HEAD:refactor/extract-realism-state
