name: Validate Hyper-Realism Upgrade

on:
  push:
    paths:
      - '.github/workflows/run-hyperrealism-upgrade.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply upgrade
        run: python3 scripts/run_upgrade.py

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload patched App
        uses: actions/upload-artifact@v4
        with:
          name: patched-app
          path: src/App.tsx
          if-no-files-found: error
