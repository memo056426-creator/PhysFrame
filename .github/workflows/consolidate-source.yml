name: Consolidate Audited Source

on:
  push:
    paths:
      - '.github/workflows/consolidate-source.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply all validated feature and audit transforms
        run: |
          python3 scripts/run_upgrade.py
          python3 scripts/hair_lock_patch.py
          python3 scripts/anti_beautification_patch.py
          python3 scripts/timeless_outfits_patch.py
          python3 scripts/production_audit_patch.py
          python3 scripts/production_audit_fix_types.py

      - name: Remove build-time patch dependency
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('package.json')
          package = json.loads(path.read_text())
          package['scripts'] = {
              'dev': 'vite',
              'build': 'tsc -b && vite build',
              'preview': 'vite preview'
          }
          path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Verify consolidated source
        run: |
          npm install
          npm audit --omit=dev --audit-level=high
          npm run build

      - name: Commit consolidated production source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx package.json
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "refactor: consolidate audited PhysFrame production source"
          git push origin HEAD:main
