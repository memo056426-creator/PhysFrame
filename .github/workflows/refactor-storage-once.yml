name: One-shot storage extraction

on:
  push:
    branches:
      - refactor/extract-reference-storage

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/extract-reference-storage

      - name: Extract storage helpers from App
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()

          import_anchor = "import { REFERENCE_IMAGE_ACCEPT, sanitizeReferenceImage } from './engine/referenceImage';\n"
          storage_import = "import { deleteImageFromDB, loadImageFromDB, saveImageToDB } from './storage/referenceImageStorage';\n"

          if storage_import not in text:
              if import_anchor not in text:
                  raise SystemExit('referenceImage import anchor not found')
              text = text.replace(import_anchor, import_anchor + storage_import, 1)

          start_marker = '// --- STORAGE HELPERS ---'
          end_marker = 'interface SavedPreset'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('storage helper block markers not found')

          text = text[:start] + text[end:]
          path.write_text(text)
          PY

      - name: Remove one-shot workflow
        run: git rm .github/workflows/refactor-storage-once.yml

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/storage/referenceImageStorage.ts
          git commit -m "refactor: move reference image persistence out of App"
          git push origin HEAD:refactor/extract-reference-storage
