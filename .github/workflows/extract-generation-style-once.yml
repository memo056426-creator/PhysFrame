name: One-shot generation style extraction

on:
  push:
    branches:
      - refactor/extract-generation-style-section
    paths:
      - .github/workflows/extract-generation-style-once.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/extract-generation-style-section

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract generation style UI
        run: python .github/extract-generation-style.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary helpers
        run: rm .github/extract-generation-style.py .github/workflows/extract-generation-style-once.yml

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/GenerationStyleSection.tsx .github
          git commit -m "refactor: extract generation style section"
          git push origin HEAD:refactor/extract-generation-style-section
