name: Engine V2 Phase 3 Refactor

on:
  push:
    branches: [engine-v2-phase3]

permissions:
  contents: write

concurrency:
  group: engine-v2-phase3-refactor
  cancel-in-progress: true

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[phase3-materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: engine-v2-phase3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Phase 3 codemod
        run: node scripts/phase3-codemod.mjs

      - name: Install dependencies
        run: npm ci

      - name: Engine tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Commit materialized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "refactor(engine): materialize typed physics integration [phase3-materialized]"
          git push origin HEAD:engine-v2-phase3
