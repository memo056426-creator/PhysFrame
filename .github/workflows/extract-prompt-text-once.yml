name: One-shot prompt text extraction

on:
  push:
    branches:
      - refactor/extract-prompt-text

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/extract-prompt-text

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Update App imports and remove local prompt builder
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()

          start = "const buildPromptText = "
          end = "// --- MAIN REACT APPLICATION ---"
          assert text.count(start) == 1, 'buildPromptText marker missing or duplicated'
          assert text.count(end) == 1, 'main app marker missing or duplicated'

          a = text.index(start)
          b = text.index(end)
          text = text[:a] + text[b:]

          old_prompt_import = "import { buildPromptIR, lintPromptIR, renderPromptIR, type PromptFacts } from './engine/promptIR';\n"
          assert old_prompt_import in text, 'old PromptIR import missing'
          text = text.replace(old_prompt_import, "import { buildPromptText } from './engine/promptText';\n", 1)

          text = text.replace("import { lintPhysicalText } from './engine/physics';\n", '', 1)
          text = text.replace("import { lintGroupSelfieText } from './engine/groupSelfie';\n", '', 1)
          text = text.replace("  SemanticScene,\n", '', 1)

          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Engine tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary workflow
        run: rm .github/workflows/extract-prompt-text-once.yml

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx .github/workflows/extract-prompt-text-once.yml
          git commit -m 'refactor: extract prompt text builder'
          git push
