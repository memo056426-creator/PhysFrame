name: One-shot local storage extraction

on:
  push:
    branches:
      - refactor/extract-local-storage

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/extract-local-storage

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract localStorage access from App
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()

          image_storage_import = "import { deleteImageFromDB, loadImageFromDB, saveImageToDB } from './storage/referenceImageStorage';\n"
          app_storage_import = "import { clearCurrentSceneState, loadCurrentSceneState, loadSavedPresets, saveCurrentSceneState, saveSavedPresets } from './storage/appStorage';\n"
          assert image_storage_import in text
          assert app_storage_import not in text
          text = text.replace(image_storage_import, image_storage_import + app_storage_import, 1)

          load_start_marker = "        const savedState = localStorage.getItem('physframe_current_state');\n"
          load_end_marker = "        const blob = await loadImageFromDB();\n"
          start = text.index(load_start_marker)
          end = text.index(load_end_marker, start)
          new_load = (
              "        const savedState = loadCurrentSceneState(localStorage);\n"
              "        if (savedState) setState(savedState);\n"
              "        const savedPresets = loadSavedPresets(localStorage);\n"
              "        if (savedPresets.length) setPresets(savedPresets);\n"
          )
          text = text[:start] + new_load + text[end:]

          replacements = {
              "try { localStorage.setItem('physframe_current_state', JSON.stringify(state)); }": "try { saveCurrentSceneState(localStorage, state); }",
              "setPresets(updatedPresets); localStorage.setItem('physframe_presets', JSON.stringify(updatedPresets));": "setPresets(updatedPresets); saveSavedPresets(localStorage, updatedPresets);",
              "setPresets(updated); localStorage.setItem('physframe_presets', JSON.stringify(updated));": "setPresets(updated); saveSavedPresets(localStorage, updated);",
              "onClick={() => {setState(DEFAULT_STATE); localStorage.removeItem('physframe_current_state');}}": "onClick={() => {setState(DEFAULT_STATE); clearCurrentSceneState(localStorage);}}",
              "import { DEFAULT_STATE, normalizeSceneState } from './state/sceneState';\n": "import { DEFAULT_STATE } from './state/sceneState';\n",
          }
          for old, new in replacements.items():
              assert old in text, f'missing replacement target: {old}'
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary workflow
        run: rm .github/workflows/extract-local-storage-once.yml

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/storage/appStorage.ts src/storage/appStorage.test.ts .github/workflows/extract-local-storage-once.yml
          git commit -m 'refactor: extract app local storage persistence'
          git push
