name: Engine V2 Phase 2 Refactor

on:
  push:
    branches:
      - engine-v2-phase2
    paths:
      - .phase2-trigger

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: engine-v2-phase2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply Phase 2 App integration
        run: python3 scripts/apply_phase2.py

      - name: Install dependencies
        run: npm ci

      - name: Run engine tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Commit integrated Phase 2 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          if git diff --cached --quiet; then
            echo "No App.tsx changes to commit"
            exit 1
          fi
          git commit -m "refactor(engine): integrate capability-based rules and smart composition [skip ci]"
          git push origin engine-v2-phase2
