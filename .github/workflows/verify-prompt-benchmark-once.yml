name: Verify prompt benchmark once

on:
  push:
    branches:
      - test/prompt-quality-benchmark
    paths:
      - .github/workflows/verify-prompt-benchmark-once.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: test/prompt-quality-benchmark

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary workflow
        run: rm .github/workflows/verify-prompt-benchmark-once.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove prompt benchmark verifier"
          git push origin HEAD:test/prompt-quality-benchmark
