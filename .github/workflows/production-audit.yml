name: PhysFrame Production Audit

on:
  push:
    paths:
      - 'scripts/production_audit_patch.py'
      - '.github/workflows/production-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply historical feature patches
        run: |
          python3 scripts/run_upgrade.py
          python3 scripts/hair_lock_patch.py
          python3 scripts/anti_beautification_patch.py
          python3 scripts/timeless_outfits_patch.py

      - name: Apply production audit patch
        run: python3 scripts/production_audit_patch.py

      - name: Install dependencies
        run: npm install

      - name: TypeScript and Vite production build
        run: |
          npx tsc -b
          npx vite build

      - name: Upload consolidated source
        uses: actions/upload-artifact@v4
        with:
          name: audited-physframe-source
          path: src/App.tsx
          if-no-files-found: error
