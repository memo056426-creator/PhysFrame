name: Materialize CodeQL security fixes

on:
  push:
    branches: [fix/codeql-security-alerts]
    paths:
      - '.github/workflows/materialize-codeql-security-fixes.yml'
      - '.github/scripts/apply-codeql-security-fixes.mjs'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply security codemod
        run: node .github/scripts/apply-codeql-security-fixes.mjs

      - name: Install dependencies
        run: npm ci

      - name: Engine tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit materialized App.tsx
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          if git diff --cached --quiet; then
            echo "No materialization changes needed."
            exit 0
          fi
          git commit -m "security: materialize safe reference-image upload"
          git push
