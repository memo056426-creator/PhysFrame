name: One-shot scene options extraction

on:
  push:
    branches:
      - refactor/extract-scene-options

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/extract-scene-options

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Extract static scene options from App
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/App.tsx')
          t = p.read_text()
          s = t.index('const SCENE_FAMILIES =')
          e = t.index('// --- BACKGROUND CROWD DYNAMICS ---')
          b = t[s:e].rstrip()

          for old, new in [
              ('const SCENE_FAMILIES =', 'export const SCENE_FAMILIES ='),
              ('const HAIRSTYLES =', 'export const HAIRSTYLES ='),
              ('const EXPRESSIONS =', 'export const EXPRESSIONS ='),
              ('const GAZE_DIRECTIONS =', 'export const GAZE_DIRECTIONS ='),
              ('const HAND_PROPS =', 'export const HAND_PROPS ='),
              ('const FACIAL_HAIR_STATES =', 'export const FACIAL_HAIR_STATES ='),
              ('const FLASH_MODES =', 'export const FLASH_MODES ='),
              ('const VIBE_PRESETS:', 'export const VIBE_PRESETS:'),
          ]:
              b = b.replace(old, new, 1)

          Path('src/data').mkdir(parents=True, exist_ok=True)
          Path('src/data/sceneOptions.ts').write_text(
              "import type { SceneState } from '../types/scene';\n\n" + b + '\n'
          )

          import_line = "import { EXPRESSIONS, FACIAL_HAIR_STATES, FLASH_MODES, GAZE_DIRECTIONS, HAND_PROPS, HAIRSTYLES, SCENE_FAMILIES, VIBE_PRESETS } from './data/sceneOptions';\n"
          anchor = "import { OUTFITS } from './data/outfits';\n"
          t = t.replace(anchor, anchor + import_line, 1)
          t = t[:s] + t[e:]
          p.write_text(t)
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Engine tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Remove one-shot workflow
        run: rm .github/workflows/extract-scene-options-once.yml

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/data/sceneOptions.ts .github/workflows/extract-scene-options-once.yml
          git commit -m "refactor: move scene options out of App"
          git push origin HEAD:refactor/extract-scene-options
