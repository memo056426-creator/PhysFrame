name: Migrate lighting ids once

on:
  push:
    branches:
      - refactor/lighting-stable-ids
    paths:
      - .github/workflows/migrate-lighting-ids-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/lighting-stable-ids

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Migrate lighting identifiers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/migrate-lighting-ids.py')
          text = path.read_text(encoding='utf-8')
          old = "    if path.suffix not in {'.ts', '.tsx'}:\n        continue\n    text = path.read_text(encoding='utf-8')"
          new = "    if path.suffix not in {'.ts', '.tsx'}:\n        continue\n    if path.name.endswith('.test.ts'):\n        continue\n    text = path.read_text(encoding='utf-8')"
          if old not in text:
              raise SystemExit('sanity-check marker not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python3 .github/scripts/migrate-lighting-ids.py

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary helpers
        run: |
          rm .github/workflows/migrate-lighting-ids-once.yml
          rm .github/scripts/migrate-lighting-ids.py

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: use stable lighting ids"
          git push origin HEAD:refactor/lighting-stable-ids
