name: One-shot preset formatting fix

on:
  push:
    branches:
      - refactor/extract-preset-management

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/extract-preset-management

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore App handler indentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()
          old = """  const handleSavePreset = () => {
          const updatedPresets = addSavedPreset(presets, state);
          if (updatedPresets === presets) return;
          setPresets(updatedPresets); saveSavedPresets(localStorage, updatedPresets);
        };

        const deletePreset = (id: string) => {
          const updated = removeSavedPreset(presets, id);
          setPresets(updated); saveSavedPresets(localStorage, updated);
        };

        const copyToClipboard = (text: string) => navigator.clipboard.writeText(text);
"""
          new = """  const handleSavePreset = () => {
            const updatedPresets = addSavedPreset(presets, state);
            if (updatedPresets === presets) return;
            setPresets(updatedPresets); saveSavedPresets(localStorage, updatedPresets);
          };
          
          const deletePreset = (id: string) => {
            const updated = removeSavedPreset(presets, id);
            setPresets(updated); saveSavedPresets(localStorage, updated);
          };

          const copyToClipboard = (text: string) => navigator.clipboard.writeText(text);
"""
          assert old in text, 'preset handler block did not match expected formatting'
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary workflow
        run: rm .github/workflows/fix-preset-indent-once.yml

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx .github/workflows/fix-preset-indent-once.yml
          git commit -m 'style: preserve App preset handler indentation'
          git push
