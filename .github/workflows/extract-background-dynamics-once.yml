name: One-shot background dynamics extraction

on:
  push:
    branches:
      - refactor/extract-background-dynamics

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/extract-background-dynamics

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply refactor
        run: python3 scripts/refactor_background_dynamics.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Engine tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Remove temporary refactor files
        run: rm .github/workflows/extract-background-dynamics-once.yml scripts/refactor_background_dynamics.py

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: extract background dynamics engine"
          git push origin HEAD:refactor/extract-background-dynamics
