name: Migrate activity ids once

on:
  push:
    branches:
      - refactor/activity-stable-ids
    paths:
      - .github/workflows/migrate-activity-ids-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/activity-stable-ids

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Migrate activity identifiers
        run: python3 .github/scripts/migrate-activity-ids.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary helpers
        run: |
          rm .github/workflows/migrate-activity-ids-once.yml
          rm .github/scripts/migrate-activity-ids.py

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: use stable activity ids"
          git push origin HEAD:refactor/activity-stable-ids
