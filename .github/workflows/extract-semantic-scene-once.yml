name: One-shot semantic scene extraction

on:
  push:
    branches:
      - refactor/extract-semantic-scene

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/extract-semantic-scene

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Update App imports and remove local semantic builder
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text()
          start_marker = '// --- DATA DICTIONARIES ---'
          end_marker = 'const buildPromptText = '
          assert start_marker in text
          assert end_marker in text
          start = text.index(start_marker)
          end = text.index(end_marker)
          block = text[start:end]
          assert 'const IDENTITY_LOCK' in block
          assert 'const buildSemanticScene' in block
          text = text[:start] + text[end:]
          anchor = "import { deriveRealismState } from './engine/realismState';\n"
          semantic_import = "import { buildSemanticScene } from './engine/semanticScene';\n"
          assert anchor in text
          assert semantic_import not in text
          text = text.replace(anchor, anchor + semantic_import, 1)
          text = text.replace("import { getCompatibleLightingSuggestions, getLightingProfile, getSmartDayTime, getSmartLightingSuggestions } from './engine/lighting';", "import { getCompatibleLightingSuggestions, getSmartDayTime, getSmartLightingSuggestions } from './engine/lighting';", 1)
          text = text.replace("import { buildPhysicalProfile, lintPhysicalText, mergeFabricPhysics } from './engine/physics';", "import { lintPhysicalText } from './engine/physics';", 1)
          text = text.replace("import { buildNegativeConstraints } from './engine/constraints';\n", '', 1)
          text = text.replace("import { buildGroupSelfieProfile, lintGroupSelfieText } from './engine/groupSelfie';", "import { lintGroupSelfieText } from './engine/groupSelfie';", 1)
          text = text.replace("import { resolveBackgroundDynamics } from './engine/backgroundDynamics';\n", '', 1)
          text = text.replace("  DerivedSceneState,\n", '', 1)
          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Engine tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary workflow
        run: rm .github/workflows/extract-semantic-scene-once.yml

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/engine/semanticScene.ts src/engine/semanticScene.test.ts .github/workflows/extract-semantic-scene-once.yml
          git commit -m 'refactor: extract semantic scene builder'
          git push
