name: One-shot scene orchestration extraction

on:
  push:
    branches:
      - refactor/extract-scene-orchestration

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/extract-scene-orchestration
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract scene orchestration
        run: python3 scripts/extract_scene_orchestration.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary helpers
        run: rm scripts/extract_scene_orchestration.py .github/workflows/extract-scene-orchestration-once.yml

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/hooks/useSceneOrchestration.ts scripts/extract_scene_orchestration.py .github/workflows/extract-scene-orchestration-once.yml
          git commit -m "refactor: extract scene orchestration"
          git push origin HEAD:refactor/extract-scene-orchestration
