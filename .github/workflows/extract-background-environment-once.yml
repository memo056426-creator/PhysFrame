name: One-shot background environment extraction

on:
  push:
    branches:
      - refactor/extract-background-environment-section
    paths:
      - scripts/refactor-background-environment.py
      - .github/workflows/extract-background-environment-once.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/extract-background-environment-section

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract background environment UI
        run: python scripts/refactor-background-environment.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary helpers
        run: |
          rm scripts/refactor-background-environment.py
          rm .github/workflows/extract-background-environment-once.yml

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: extract background environment section"
          git push
