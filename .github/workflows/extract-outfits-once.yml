name: One-shot outfit extraction

on:
  push:
    branches:
      - refactor/extract-outfits
    paths:
      - '.github/workflows/extract-outfits-once.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/extract-outfits

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract outfits from App
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('src/App.tsx')
          text = app_path.read_text()

          marker = 'const OUTFITS = ['
          start = text.index(marker)
          array_start = text.index('[', start)

          depth = 0
          quote = None
          escaped = False
          array_end = None

          for i in range(array_start, len(text)):
              ch = text[i]

              if quote is not None:
                  if escaped:
                      escaped = False
                  elif ch == '\\':
                      escaped = True
                  elif ch == quote:
                      quote = None
                  continue

              if ch in ("'", '"', '`'):
                  quote = ch
              elif ch == '[':
                  depth += 1
              elif ch == ']':
                  depth -= 1
                  if depth == 0:
                      array_end = i
                      break

          if array_end is None:
              raise RuntimeError('Could not locate the end of OUTFITS')

          semicolon_end = text.index(';', array_end) + 1
          block = text[start:semicolon_end]

          data_dir = Path('src/data')
          data_dir.mkdir(parents=True, exist_ok=True)
          outfits_path = data_dir / 'outfits.ts'
          outfits_path.write_text(block.replace('const OUTFITS', 'export const OUTFITS', 1) + '\n')

          text = text[:start] + text[semicolon_end:]

          import_anchor = "import { deleteImageFromDB, loadImageFromDB, saveImageToDB } from './storage/referenceImageStorage';\n"
          outfit_import = "import { OUTFITS } from './data/outfits';\n"
          if outfit_import not in text:
              text = text.replace(import_anchor, import_anchor + outfit_import, 1)

          app_path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Engine tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/extract-outfits-once.yml

      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/data/outfits.ts .github/workflows/extract-outfits-once.yml
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: move outfits out of App'
          git push origin HEAD:refactor/extract-outfits
