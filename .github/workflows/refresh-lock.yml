name: Refresh dependency lockfile

on:
  push:
    branches:
      - dependabot/npm_and_yarn/vitest-4.1.11

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: dependabot/npm_and_yarn/vitest-4.1.11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate package lock
        run: npm install --package-lock-only

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git commit -m "chore: refresh lockfile for Vitest security update"
          git push origin HEAD:dependabot/npm_and_yarn/vitest-4.1.11
