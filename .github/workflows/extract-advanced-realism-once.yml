name: One-shot advanced realism extraction

"on":
  push:
    branches:
      - refactor/extract-advanced-realism
    paths:
      - .github/workflows/extract-advanced-realism-once.yml

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/extract-advanced-realism

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract advanced realism UI
        run: python3 scripts/refactor_advanced_realism.py

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary helpers
        run: rm .github/workflows/extract-advanced-realism-once.yml scripts/refactor_advanced_realism.py

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/components/AdvancedRealismSection.tsx .github/workflows/extract-advanced-realism-once.yml scripts/refactor_advanced_realism.py
          git commit -m 'refactor: extract advanced realism section'
          git push
