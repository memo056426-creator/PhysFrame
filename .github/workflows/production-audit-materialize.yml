name: Materialize Production Audit

on:
  push:
    paths:
      - '.github/workflows/production-audit-materialize.yml'

permissions:
  contents: write

jobs:
  audit-and-materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Materialize existing feature patches
        run: npm run prebuild

      - name: Reconstruct production audit
        run: |
          cat scripts/.production_audit_part1 scripts/.production_audit_part2 scripts/.production_audit_part3 scripts/.production_audit_part4 | base64 -d | gzip -d > /tmp/production_audit.py
          python3 /tmp/production_audit.py

      - name: Verify audit invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          text = Path('src/App.tsx').read_text()
          pkg = json.loads(Path('package.json').read_text())
          checks = {
              'static outfits': 'filteredOutfits' not in text,
              '15 timeless outfits': text.count("id: 'timeless") == 15,
              'manual hair preserved': "hairStyle: 'h1'" not in text,
              'legacy background values removed': all(v not in text for v in ['empty-still', 'casual-indifferent', 'busy-motion']),
              'glasses linkage': 'state.hasGlasses' in text and 'eyeglass' in text.lower(),
              'background linkage': 'resolveBackgroundDynamics(state)' in text,
              'framing linkage': 'framingImperfectionDetails' in text,
              'digital zoom linkage': 'state.useDigitalZoom' in text,
              'negative constraints': 'buildNegativeConstraints' in text and 'plastic skin' in text and 'perfect facial symmetry' in text,
              'raw skin': 'T-zone oiliness' in text and 'ZERO digital skin smoothing' in text,
              'storage sanitizer': 'sanitizeSceneState' in text and 'safeReadJSON' in text,
              'dead reference id removed': 'referenceImageId' not in text,
              'no build-time patch scripts': 'prebuild' not in pkg['scripts'] and 'predev' not in pkg['scripts'],
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items(): print(('PASS' if ok else 'FAIL'), name)
          if failed: raise SystemExit('Audit invariant failures: ' + ', '.join(failed))
          PY

      - name: Production build
        run: npm run build

      - name: Remove obsolete patch machinery
        run: |
          rm -f scripts/run_upgrade.py scripts/upgrade_hyperrealism.py scripts/hair_lock_patch.py scripts/anti_beautification_patch.py scripts/timeless_outfits_patch.py
          rm -f scripts/.production_audit_part1 scripts/.production_audit_part2 scripts/.production_audit_part3 scripts/.production_audit_part4
          rm -f .github/workflows/run-hyperrealism-upgrade.yml .github/workflows/audit-snapshot.yml .github/workflows/production-audit-materialize.yml

      - name: Commit audited production source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: materialize audited PhysFrame production source'
          git push
