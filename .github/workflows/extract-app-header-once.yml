name: One-shot app header extraction

on:
  push:
    branches:
      - refactor/extract-app-header

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/extract-app-header
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract app header UI
        run: python3 scripts/extract_app_header.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary helpers
        run: rm scripts/extract_app_header.py .github/workflows/extract-app-header-once.yml

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/AppHeader.tsx scripts/extract_app_header.py .github/workflows/extract-app-header-once.yml
          git commit -m "refactor: extract app header"
          git push origin HEAD:refactor/extract-app-header
