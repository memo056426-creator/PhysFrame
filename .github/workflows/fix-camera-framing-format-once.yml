name: One-shot camera framing formatting cleanup

"on":
  push:
    branches:
      - refactor/extract-camera-framing

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/extract-camera-framing

      - name: Fix camera framing component indentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()
          token = '<CameraFramingSection'
          token_index = text.index(token)
          start = text.rfind('\n', 0, token_index) + 1
          end = text.index('/>', token_index) + 2
          replacement = (
              '                <CameraFramingSection\n'
              '                  state={state}\n'
              '                  onCaptureTypeChange={captureType => setState(current => ({\n'
              '                    ...current,\n'
              '                    captureType,\n'
              "                    groupSelfieEnabled: captureType === 'front-selfie' ? current.groupSelfieEnabled : false\n"
              '                  }))}\n'
              '                  onFramingChange={framing => setState(current => ({ ...current, framing }))}\n'
              '                  onCameraAngleChange={cameraAngle => setState(current => ({ ...current, cameraAngle }))}\n'
              '                  onGroupSelfieEnabledChange={groupSelfieEnabled => setState(current => ({ ...current, groupSelfieEnabled }))}\n'
              '                  onGroupSelfieCompanionCountChange={groupSelfieCompanionCount => setState(current => ({ ...current, groupSelfieCompanionCount }))}\n'
              '                  onFramingImperfectionChange={framingImperfection => setState(current => ({ ...current, framingImperfection }))}\n'
              '                  onDigitalZoomChange={useDigitalZoom => setState(current => ({ ...current, useDigitalZoom }))}\n'
              '                />'
          )
          path.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/fix-camera-framing-format-once.yml

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx .github/workflows/fix-camera-framing-format-once.yml
          git commit -m 'style: align camera framing component call'
          git push
