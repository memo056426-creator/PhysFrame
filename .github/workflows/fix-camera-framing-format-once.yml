name: One-shot camera framing formatting cleanup

"on":
  push:
    branches:
      - refactor/extract-camera-framing

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/extract-camera-framing

      - name: Fix camera framing component indentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()
          old = '''                <CameraFramingSection
        state={state}
        onCaptureTypeChange={captureType => setState(current => ({
          ...current,
          captureType,
          groupSelfieEnabled: captureType === 'front-selfie' ? current.groupSelfieEnabled : false
        }))}
        onFramingChange={framing => setState(current => ({ ...current, framing }))}
        onCameraAngleChange={cameraAngle => setState(current => ({ ...current, cameraAngle }))}
        onGroupSelfieEnabledChange={groupSelfieEnabled => setState(current => ({ ...current, groupSelfieEnabled }))}
        onGroupSelfieCompanionCountChange={groupSelfieCompanionCount => setState(current => ({ ...current, groupSelfieCompanionCount }))}
        onFramingImperfectionChange={framingImperfection => setState(current => ({ ...current, framingImperfection }))}
        onDigitalZoomChange={useDigitalZoom => setState(current => ({ ...current, useDigitalZoom }))}
      />'''
          new = '''                <CameraFramingSection
                  state={state}
                  onCaptureTypeChange={captureType => setState(current => ({
                    ...current,
                    captureType,
                    groupSelfieEnabled: captureType === 'front-selfie' ? current.groupSelfieEnabled : false
                  }))}
                  onFramingChange={framing => setState(current => ({ ...current, framing }))}
                  onCameraAngleChange={cameraAngle => setState(current => ({ ...current, cameraAngle }))}
                  onGroupSelfieEnabledChange={groupSelfieEnabled => setState(current => ({ ...current, groupSelfieEnabled }))}
                  onGroupSelfieCompanionCountChange={groupSelfieCompanionCount => setState(current => ({ ...current, groupSelfieCompanionCount }))}
                  onFramingImperfectionChange={framingImperfection => setState(current => ({ ...current, framingImperfection }))}
                  onDigitalZoomChange={useDigitalZoom => setState(current => ({ ...current, useDigitalZoom }))}
                />'''
          assert old in text, 'camera framing component block not found'
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/fix-camera-framing-format-once.yml

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx .github/workflows/fix-camera-framing-format-once.yml
          git commit -m 'style: align camera framing component call'
          git push
