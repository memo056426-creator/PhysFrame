name: One-shot active scene basics extraction

"on":
  push:
    branches:
      - refactor/extract-active-scene-basics

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/extract-active-scene-basics

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract active scene basics UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()

          anchor = "import { SceneSelectionSection } from './components/SceneSelectionSection';\n"
          replacement_import = anchor + "import { ActiveSceneBasicsSection } from './components/ActiveSceneBasicsSection';\n"
          assert anchor in text, 'scene selection import anchor missing'
          text = text.replace(anchor, replacement_import, 1)

          text = text.replace(', SCENE_FAMILIES, VIBE_PRESETS }', ', SCENE_FAMILIES }', 1)

          active_family_line = "  const activeFamily = state.sceneFamily ? SCENE_FAMILIES[state.sceneFamily] : null;\n\n"
          assert active_family_line in text, 'activeFamily declaration missing'
          text = text.replace(active_family_line, '', 1)

          start_marker = '                <section className="bg-gradient-to-r from-[var(--accent)]/10 to-transparent p-4 rounded-2xl border border-[var(--accent)]/20">'
          end_marker = '                <section className="bg-[var(--bg-card)] p-4 rounded-2xl border border-[var(--border)]">\n                  <h3 className="font-medium mb-3 text-sm text-[var(--text-muted)]">الخلفية والبيئة</h3>'
          start = text.index(start_marker)
          end = text.index(end_marker, start)

          replacement = '''                <ActiveSceneBasicsSection
                  state={state}
                  onVibePreset={handleVibePreset}
                  onChangeLocation={() => setState(current => ({ ...current, sceneFamily: null }))}
                  onSubSceneChange={subScene => setState(current => ({ ...current, subScene }))}
                  onActivityChange={activity => setState(current => ({ ...current, activity }))}
                  onPoseChange={pose => setState(current => ({ ...current, pose }))}
                />\n\n'''

          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary workflow
        run: rm .github/workflows/extract-active-scene-basics-once.yml

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx .github/workflows/extract-active-scene-basics-once.yml
          git commit -m 'refactor: extract active scene basics section'
          git push
