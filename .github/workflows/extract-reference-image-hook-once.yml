name: One-shot reference image hook extraction

on:
  push:
    branches:
      - refactor/extract-reference-image-hook

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract reference image hook
        run: python scripts/extract_reference_image_hook.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Remove temporary helpers
        run: rm scripts/extract_reference_image_hook.py .github/workflows/extract-reference-image-hook-once.yml

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/hooks/useReferenceImage.ts scripts/extract_reference_image_hook.py .github/workflows/extract-reference-image-hook-once.yml
          git commit -m "refactor: extract reference image hook"
          git push
